name: Build Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: JavaScript tests
        run: npm test
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Native tests
        run: npm run test:native -- --locked
      - name: Build portable executable
        run: npm run build
      - name: Check executable startup and write checksum
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath dist -Filter '*.exe')
          if ($executables.Count -ne 1) { throw 'Expected exactly one portable executable' }
          $executable = $executables[0]
          $application = Start-Process -FilePath $executable.FullName -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($application.HasExited) { throw "Application exited during startup: $($application.ExitCode)" }
          } finally {
            if (!$application.HasExited) { Stop-Process -Id $application.Id }
          }
          $releaseHash = Get-FileHash -LiteralPath $executable.FullName -Algorithm SHA256
          "$($releaseHash.Hash.ToLower())  $($executable.Name)" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OcuTrain-windows-portable
          path: dist/
          if-no-files-found: error
