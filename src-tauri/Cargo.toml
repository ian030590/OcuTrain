[package]
name = "ocutrain"
version = "1.5.0"
description = "OcuTrain eye movement training"
authors = ["OcuTrain contributors"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
